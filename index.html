<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>深淵遠征</title>
<style>
:root{--bg:#0e0e14;--p:#16161f;--p2:#1c1c28;--ln:#2c2c3c;--tx:#e6e4f0;--mu:#8886a0;--g:#d4b56a;--r:#e07070;--b:#7ab0e0;--gn:#6ecf8a;--pu:#b090e0;--or:#e09060}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:20px}
button,input,select{font:inherit;touch-action:manipulation}
button{background:#2a2a3a;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;min-height:44px;cursor:pointer}
button.primary{background:#3d5a80;border-color:#5a7aa0}button.danger{background:#5a3030;border-color:#8a5050}
button.sm{padding:8px 10px;min-height:36px;font-size:12px}button:disabled{opacity:.35}
input,select{background:#12121a;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:10px;min-height:40px}
header{background:#14141c;border-bottom:1px solid var(--ln);padding:12px 14px;position:sticky;top:0;z-index:20}
.brand{font-size:17px;font-weight:700;color:var(--g)}.sub{font-size:11px;color:var(--mu);margin-top:2px}
main{max-width:640px;margin:0 auto;padding:8px}
.win{background:var(--p);border:1px solid var(--ln);border-radius:10px;overflow:hidden;margin-bottom:8px}
.wt{background:var(--p2);padding:10px 12px;font-size:13px;font-weight:600;color:var(--g);border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.wb{padding:10px 12px}
.tabs{display:flex;overflow-x:auto;gap:4px;padding:8px;background:var(--p2);border-bottom:1px solid var(--ln);-webkit-overflow-scrolling:touch}
.tabs button{flex:0 0 auto;font-size:12px;padding:8px 12px;border-radius:6px;white-space:nowrap}.tabs .on{background:#3d5a80;color:#fff}
.view{display:none}.view.on{display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:#12121a;border:1px solid var(--ln);border-radius:8px;padding:8px;font-size:11px}
.stat b{display:block;font-size:15px;margin-top:2px}
.bar{height:5px;background:#2a2030;border-radius:3px;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--r)}
.bar.mp i{background:var(--b)}.bar.xp i{background:var(--pu)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mu{color:var(--mu);font-size:12px}
.char-card{background:#12121a;border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:10px}
.char-card b{color:var(--g);font-size:16px}
.char-card .btns{display:flex;gap:10px;margin-top:12px}
.char-card .btns button{flex:1;min-height:48px;font-size:15px}
.item{padding:12px 0;border-bottom:1px solid #222230}
.item:last-child{border:0}
.普通{color:#c0c0c0}.魔法{color:#7ab0e0}.稀有{color:#d4b56a}.史詩{color:#b090e0}.傳奇{color:#e09060}.獨特{color:#c9a84c}.套裝{color:#6ecf8a}
.pill{display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;background:#222230;color:var(--mu);margin-left:4px}
.eq-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.eq-slot{background:#12121a;border:1px solid var(--ln);border-radius:8px;padding:8px;min-height:56px;font-size:12px}
.eq-slot .lab{color:var(--mu);font-size:10px;margin-bottom:3px}
.log{height:180px;overflow-y:auto;background:#0c0c12;border:1px solid var(--ln);border-radius:8px;padding:8px;font-size:11px;font-family:ui-monospace,monospace}
.log p{margin:0 0 3px}.log .t{color:#555}.log .dmg{color:var(--or)}.log .heal{color:var(--gn)}.log .drop{color:var(--g)}.log .sys{color:var(--b)}.log .warn{color:var(--r)}.log .sum{color:var(--pu)}.log .ele{color:#e0a060}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.info-box{background:#12121a;border:1px solid var(--ln);border-radius:8px;padding:10px;font-size:12px}
.info-box .t{color:var(--g);font-size:11px;margin-bottom:4px;font-weight:600}
.attr-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #222230}
.attr-ctrl button{min-width:44px;min-height:44px;font-size:18px;font-weight:700}
.sell-bar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.sell-bar button{flex:1 1 30%;min-width:80px}
.notice{font-size:11px;color:#a09070;border:1px dashed #5a5040;padding:8px;border-radius:6px;margin-top:8px}
.hidden{display:none!important}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.dialog{background:var(--p);border:1px solid var(--ln);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:640px;max-height:75vh;overflow:auto}
.dialog h3{color:var(--g);margin-bottom:12px;font-size:17px}
.dialog .actions{display:flex;gap:10px;margin-top:16px}
.dialog .actions button{flex:1;min-height:48px;font-size:15px}
.class-card{background:#12121a;border:1px solid var(--ln);border-radius:10px;padding:12px;margin:6px 0}
.class-card.on{border-color:var(--g)}
.class-card h4{color:var(--g);margin-bottom:4px}
.sk-card{background:#12121a;border:1px solid var(--ln);border-radius:8px;padding:10px;margin:6px 0}
.enemy-box{background:#12121a;border:1px solid var(--ln);border-radius:8px;padding:10px;margin:6px 0;font-size:12px}
.zone-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.zone-scroll button{flex:0 0 auto;white-space:nowrap}
.minion{font-size:12px;padding:4px 0;border-bottom:1px solid #222}
.cfg label{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1e1e28;font-size:13px}
.link{color:var(--gn);text-decoration:underline;cursor:pointer}
</style>
</head>

      <div id="v-hunt" class="view"></div>

</main>

</div>
<script>
(function(){
"use strict";
var STORE="abyss_v10", MAX_LV=100;
var $=function(id){return document.getElementById(id)};
var rnd=function(a,b){return Math.floor(Math.random()*(b-a+1))+a};
var pick=function(a){return a[Math.floor(Math.random()*a.length)]};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var esc=function(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")};

/* === 存檔安全核心 schema v2 === */
var SAVE_FORMAT="abyss-save", SCHEMA_VERSION=2, SAVE_KEY="abyss_hmac_client_v2", BACKUP_KEY="abyss_v10_backups", MAX_BACKUPS=3;
function goldCap(lv){return Math.min(500000000,5000+lv*lv*800)}
function stableStringify(obj){
  if(obj===null||typeof obj!=="object")return JSON.stringify(obj);
  if(Array.isArray(obj))return "["+obj.map(stableStringify).join(",")+"]";
  var keys=Object.keys(obj).sort();
  return "{"+keys.map(function(k){return JSON.stringify(k)+":"+stableStringify(obj[k])}).join(",")+"}";
}
function simpleHmac(str,key){
  var s=key+"|"+str+"|"+key,h1=2166136261,h2=0x811c9dc5;
  for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);h1^=c;h1=(h1*16777619)>>>0;h2=((h2<<5)+h2+c)>>>0}
  return ("00000000"+h1.toString(16)).slice(-8)+("00000000"+h2.toString(16)).slice(-8);
}
function signPayload(dataObj){return simpleHmac(stableStringify(dataObj),SAVE_KEY)}
function pushBackup(snapshot){
  try{var arr=JSON.parse(localStorage.getItem(BACKUP_KEY)||"[]");if(!Array.isArray(arr))arr=[];arr.unshift({at:Date.now(),data:snapshot});localStorage.setItem(BACKUP_KEY,JSON.stringify(arr.slice(0,MAX_BACKUPS)))}catch(e){}
}
function validateCharacter(ch,idx){
  var errs=[];
  if(!ch||typeof ch!=="object"){errs.push("欄位"+idx+"非物件");return errs}
  if(typeof ch.name!=="string"||!ch.name.trim())errs.push("欄位"+idx+"名稱無效");
  if(typeof CLASSES==="undefined"||!CLASSES[ch.cid])errs.push("欄位"+idx+"職業無效");
  var lv=ch.lv|0; if(lv<1||lv>MAX_LV)errs.push("欄位"+idx+"等級越界:"+lv);
  if(typeof ch.gold!=="number"||!isFinite(ch.gold)||ch.gold<0)errs.push("欄位"+idx+"金幣無效");
  else if(ch.gold>goldCap(lv)*3)errs.push("欄位"+idx+"金幣異常偏高");
  if(typeof ch.xp!=="number"||!isFinite(ch.xp)||ch.xp<0)errs.push("欄位"+idx+"經驗無效");
  if(typeof ch.sp!=="number"||ch.sp<0||ch.sp>MAX_LV+5)errs.push("欄位"+idx+"技能點異常");
  if(typeof ch.ap!=="number"||ch.ap<0||ch.ap>MAX_LV+5)errs.push("欄位"+idx+"屬性點異常");
  var sk=ch.skills||{}, trees={};
  Object.keys(sk).forEach(function(k){var n=sk[k]|0;if(n<0||n>15)errs.push("技能等級非法:"+k);var t=k.split("::")[0];if(t)trees[t]=1});
  if(Object.keys(trees).length>1)errs.push("欄位"+idx+"違反專精（跨系）");
  if(!Array.isArray(ch.items))errs.push("欄位"+idx+"背包非陣列");
  else if(ch.items.length>500)errs.push("欄位"+idx+"背包過多");
  if(Array.isArray(ch.minions)&&ch.minions.length>20)errs.push("欄位"+idx+"召喚過多");
  return errs;
}
function validateSaveData(data){
  var errs=[];
  if(!data||typeof data!=="object")return["根物件無效"];
  if(!Array.isArray(data.slots))errs.push("slots必須為陣列");
  else{if(data.slots.length>2)errs.push("角色欄超過2");data.slots.forEach(function(ch,i){if(ch)errs=errs.concat(validateCharacter(ch,i))})}
  if(data.active!=null&&data.active!==-1&&(data.active<0||data.active>1))errs.push("active非法");
  return errs;
}
function buildExportPackage(){
  var data={slots:slots,active:active,schemaVersion:SCHEMA_VERSION};
  return{format:SAVE_FORMAT,schemaVersion:SCHEMA_VERSION,exportedAt:new Date().toISOString(),data:data,sig:signPayload(data)};
}
function tryImportPackage(obj){
  if(!obj||typeof obj!=="object")return{ok:false,errors:["無法解析"]};
  if(obj.format===SAVE_FORMAT){
    if(obj.schemaVersion!==SCHEMA_VERSION&&obj.schemaVersion!==1)return{ok:false,errors:["不支援schemaVersion:"+obj.schemaVersion]};
    if(!obj.data)return{ok:false,errors:["缺少data"]};
    if(!obj.sig||obj.sig!==signPayload(obj.data))return{ok:false,errors:["完整性簽章不符（可能被修改）"]};
    var ve=validateSaveData(obj.data); if(ve.length)return{ok:false,errors:ve};
    return{ok:true,errors:[],data:obj.data};
  }
  if(obj.slots){
    var ve2=validateSaveData(obj); if(ve2.length)return{ok:false,errors:ve2};
    return{ok:true,errors:[],data:obj,legacy:true};
  }
  if(obj.cid){
    var wrap={slots:[obj,null],active:0}; var ve3=validateSaveData(wrap);
    if(ve3.length)return{ok:false,errors:ve3}; return{ok:true,errors:[],data:wrap,legacy:true};
  }
  return{ok:false,errors:["無法識別存檔格式"]};
}


function showDlg(title,body,buttons){
  $("dlgTitle").textContent=title;
  $("dlgBody").innerHTML=body;
  var act=$("dlgActions"); act.innerHTML="";
  (buttons||[{t:"確定",fn:null}]).forEach(function(b){
    var btn=document.createElement("button");
    btn.textContent=b.t;
    if(b.danger)btn.className="danger";
    if(b.primary)btn.className="primary";
    btn.onclick=function(){$("overlay").classList.add("hidden");if(b.fn)b.fn()};
    act.appendChild(btn);
  });
  $("overlay").classList.remove("hidden");
}
function askYes(msg,onYes){
  showDlg("確認",esc(msg),[{t:"確定",danger:true,fn:onYes},{t:"取消",fn:null}]);
}

function load(){

    ["abyss_v09","abyss_v08"].forEach(function(k){

      if(old&&!slots.some(Boolean)){try{var x=JSON.parse(old);if(x.slots){slots=x.slots;saveAll()}else if(x.cid){slots=[x,null];saveAll()}}catch(e){}}

function itemDesc(it){
  if(!it.id_ed)return"【未鑑定】";
  var a=[];if(it.req)a.push("需求等級 "+it.req);
  if(it.bs)Object.keys(it.bs).forEach(function(k){if(it.bs[k])a.push(fmtAffix(k,it.bs[k]))});
  if(it.mods)Object.keys(it.mods).forEach(function(k){if(it.mods[k])a.push(fmtAffix(k,it.mods[k]))});
  if(it.sock)a.push("凹槽 "+(it.filled?it.filled.length:0)+"/"+it.sock);
  if(it.set)a.push("套裝："+it.set);
  if(it.rw)a.push("符文之語："+it.rw);
  if(it.unique&&it.desc)a.push("「"+it.desc+"」");
  return a.join(" · ")||"—";
}
function itemName(it){
  if(!it.id_ed)return"未鑑定的"+it.slot;
  if(it.rw)return it.rw;
  var n=it.name;
  if(it.filled&&it.filled.length)n+=" ["+it.filled.join("+")+"]";
  return n;
}
function getSkill(key){if(!S)return null;var list=buildSkills(S.cid);for(var i=0;i<list.length;i++)if(list[i].key===key)return list[i];return null}
function mods(){
  var m={atk:0,spell:0,def:0,hp:0,mp:0,str:0,dex:0,fire:0,cold:0,light:0,poison:0,holy:0,res:0,atkPct:0,spellPct:0,defPct:0,hpPct:0,mpPct:0,firePct:0,coldPct:0,lightPct:0,lifeRegen:0,lifeSteal:0,summonAtk:0,summonHp:0,summonCap:0,fireRes:0,coldRes:0,lightRes:0,poisonRes:0,curseRes:0,allSkills:0,classSkills:0,fhr:0,frw:0,mf:0,gf:0,dr:0,cdr:0,manaOnKill:0,lifeOnKill:0};
  if(!S)return m;
  function addMods(src){if(!src)return;Object.keys(src).forEach(function(k){m[k]=(m[k]||0)+(src[k]||0)})}
  var setCount={};
  Object.keys(S.eq).forEach(function(slot){
    var id=S.eq[slot],it=null;
    for(var i=0;i<S.items.length;i++)if(S.items[i].id===id){it=S.items[i];break}
    if(!it||!it.id_ed)return;
    addMods(it.bs);addMods(it.mods);addMods(it.rwMods);
    if(it.set)setCount[it.set]=(setCount[it.set]||0)+1;
    if(it.sock&&it.filled&&!it.rw){
      it.filled.forEach(function(rid){
        var rn=RUNE_BY_ID[rid]||RUNE_BY_ID[RUNE_MIG[rid]]||null;
        if(rn)addMods(rn.m);
      });
    }
  });
  /* 套裝 3/6/9 */
  Object.keys(setCount).forEach(function(sn){
    var info=SETS_INFO[sn]; if(!info)return;
    var c=setCount[sn];
    if(c>=3){m.hp+=20;m.atkPct+=6;m.res+=5}
    if(c>=6){m.atkPct+=10;m.spellPct+=8;m.res+=12;m.hpPct+=6}
    if(c>=9){m.res+=50;m.atkPct+=12;m.spellPct+=10;m.hpPct+=10;m.dr=(m.dr||0)+4} /* 全套必備+50全抗 */
  });
  Object.keys(S.skills).forEach(function(k){
    var n=S.skills[k];if(!n)return;var sk=getSkill(k);if(!sk||sk.t!=="passive")return;
    var lvMul=n; /* 每級疊加 */
    if(sk.atkPct)m.atkPct+=sk.atkPct*lvMul;
    if(sk.spellPct)m.spellPct+=sk.spellPct*lvMul;
    if(sk.defPct)m.defPct+=sk.defPct*lvMul;
    if(sk.hpPct)m.hpPct+=sk.hpPct*lvMul;
    if(sk.mpPct)m.mpPct+=sk.mpPct*lvMul;
    if(sk.ls)m.lifeSteal+=sk.ls*lvMul;
    if(sk.res)m.res+=sk.res*lvMul;
    if(sk.firePct)m.firePct+=sk.firePct*lvMul;
    if(sk.coldPct)m.coldPct+=sk.coldPct*lvMul;
    if(sk.lightPct)m.lightPct+=sk.lightPct*lvMul;
    if(sk.sumAtk)m.summonAtk+=sk.sumAtk*lvMul;
    if(sk.sumHp)m.summonHp+=sk.sumHp*lvMul;
    if(sk.sumCap)m.summonCap+=sk.sumCap*lvMul;
    if(sk.regen)m.lifeRegen+=sk.regen*lvMul;
  });
  return m;
}
function tot(){
  var m=mods();
  var skillBonus=1+0.04*((m.allSkills||0)+(m.classSkills||0));
  var sb=Math.floor((S.str+m.str)*0.4),db=Math.floor((S.dex+m.dex)*0.3),vb=Math.floor(S.vit*0.8),eb=Math.floor(S.ene*0.6);
  var atk=S.atk+Math.floor(S.lv*1.2)+m.atk+sb+Math.floor((S.atk+m.atk+sb)*m.atkPct/100);
  atk=Math.floor(atk*skillBonus);
  var sp=S.spell+Math.floor(S.lv*0.9)+m.spell+eb+Math.floor((S.spell+m.spell+eb)*m.spellPct/100);
  sp=Math.floor(sp*skillBonus);
  var def=S.def+Math.floor(S.lv*0.6)+m.def+Math.floor(db*0.5)+Math.floor((S.def+m.def)*m.defPct/100);
  if(S.buffs&&S.buffs.atk)atk=Math.floor(atk*(1+S.buffs.atk));
  if(S.buffs&&S.buffs.def)def=Math.floor(def*(1+S.buffs.def));
  return{m:m,a:atk,sp:sp,d:def,
    hp:S.mhp+m.hp+vb+Math.floor(S.mhp*m.hpPct/100),
    mp:S.mmp+m.mp+eb+Math.floor(S.mmp*m.mpPct/100),
    fireRes:Math.min(75,(m.res||0)+(m.fireRes||0)),
    coldRes:Math.min(75,(m.res||0)+(m.coldRes||0)),
    lightRes:Math.min(75,(m.res||0)+(m.lightRes||0)),
    poisonRes:Math.min(75,(m.res||0)+(m.poisonRes||0)),
    curseRes:Math.min(75,(m.res||0)+(m.curseRes||0)),
    dr:Math.min(50,m.dr||0)};
}
function needXp(){return Math.floor(40*Math.pow(S.lv,1.42))}
function levelUp(){
  while(S.xp>=needXp()&&S.lv<MAX_LV){
    S.xp-=needXp();S.lv++;S.sp++;S.ap++;
    S.mhp+=3;S.mmp+=2;S.atk++;S.spell++;S.def++;
    var t=tot();S.hp=t.hp;S.mp=t.mp;
    log("升級！Lv."+S.lv+" 技能點+1 屬性點+1","sys");
  }
  if(S.lv>=MAX_LV)S.xp=0;
}

/* 怪物詞綴規則 */
function shouldAffix(rank){
  if(S.diff===2)return true;
  if(S.diff===1)return rank!=="normal";
  return rank==="boss"||rank==="unique";
}
function applyAffixes(en,rank){
  if(!shouldAffix(rank))return en;
  var count=1;
  if(S.diff===2){
    if(rank==="unique"||rank==="boss")count=rnd(3,5);
    else if(rank==="champ")count=rnd(2,3);
    else count=rnd(1,2);
  }else if(S.diff===1){
    if(rank==="unique"||rank==="boss")count=rnd(2,3);
    else count=1;
  }else{
    count=rank==="unique"?rnd(2,3):1;
  }
  en.affixes=[];en.ele=null;en.elePct=0;en.res={};
  var used={};
  for(var i=0;i<count;i++){
    var a=pick(MOB_AFFIXES);
    if(used[a.n])continue;used[a.n]=1;
    en.affixes.push(a.n);
    if(a.atkM)en.atk=Math.floor(en.atk*a.atkM);
    if(a.hpM){en.hp=Math.floor(en.hp*a.hpM);en.max=en.hp}
    if(a.defM)en.def=Math.floor(en.def*a.defM);
    if(a.ele){en.ele=a.ele;en.elePct=(en.elePct||0)+(a.elePct||0)}
    if(a.res)Object.keys(a.res).forEach(function(k){en.res[k]=(en.res[k]||0)+a.res[k]});
    if(a.lootM)en.loot=(en.loot||1)*a.lootM;
  }
  if(S.diff===2){
    en.res.fire=(en.res.fire||0)+25;en.res.cold=(en.res.cold||0)+25;
    en.res.light=(en.res.light||0)+25;en.res.poison=(en.res.poison||0)+20;
    en.res.curse=(en.res.curse||0)+20;
  }
  if(en.affixes.length)en.name=en.affixes.join("")+"的"+en.name;
  return en;
}
function makeOneEnemy(name,rank,lv){
  var dm=DIFF[S.diff][1],xm=DIFF[S.diff][2];
  var mult=rank==="unique"?4.5:rank==="boss"?3.2:rank==="champ"?1.7:1;
  var h=Math.floor((22+lv*11)*dm*mult);
  var en={name:name,rank:rank,lv:lv,hp:h,max:h,
    atk:Math.floor((4+lv*2.3)*dm*(rank==="unique"?2:rank==="boss"?1.7:rank==="champ"?1.25:1)),
    def:Math.floor((1+lv*0.65)*dm),
    xp:Math.floor((9+lv*3.5)*xm*(rank==="unique"?12:rank==="boss"?8:rank==="champ"?2.2:1)),
    gold:Math.floor((3+lv*1.8)*dm*(rank==="unique"?10:rank==="boss"?6:rank==="champ"?1.8:1)),
    loot:(rank==="unique"?3:rank==="boss"?2:rank==="champ"?1.3:1),
    defDown:0,atkDown:0,dot:0,dotDur:0,ele:null,elePct:0,res:{},affixes:[]};
  return applyAffixes(en,rank);
}
function genPack(){
  var z=ZONES[Math.min(S.zone,ZONES.length-1)];
  var lv=S.lv+Math.floor(S.kills/15)+S.zone*2;
  var list=[];
  if(z.unique){
    var bossName=pick(z.bosses);
    list.push(makeOneEnemy(bossName,"unique",lv+5));
    for(var i=0;i<7;i++)list.push(makeOneEnemy(pick(z.bosses),"boss",lv+2));
  }else{
    var roll=Math.random();
    var isUniqueBoss=roll<0.03||S.kills%40===39;
    var isBoss=!isUniqueBoss&&(roll<0.08||S.kills%25===24);
    var isChamp=!isUniqueBoss&&!isBoss&&roll<0.18;
    if(isUniqueBoss){
      list.push(makeOneEnemy(z.boss,"unique",lv+4));
      for(var j=0;j<7;j++)list.push(makeOneEnemy(z.boss,"boss",lv+1));
    }else if(isBoss){
      list.push(makeOneEnemy(z.boss,"boss",lv+2));
      for(var k=0;k<7;k++)list.push(makeOneEnemy(pick(z.mobs),"normal",lv));
    }else if(isChamp){
      list.push(makeOneEnemy(pick(z.champ),"champ",lv+1));
      for(var m=0;m<7;m++)list.push(makeOneEnemy(pick(z.mobs),"normal",lv));
    }else{
      var cnt=rnd(1,Math.min(8,2+Math.floor(S.diff*2)));
      for(var n=0;n<cnt;n++)list.push(makeOneEnemy(pick(z.mobs),"normal",lv));
    }
  }
  return list.slice(0,8);
}

function playerRes(ele){
  var t=tot();
  if(ele==="fire")return t.fireRes;
  if(ele==="cold")return t.coldRes;
  if(ele==="light")return t.lightRes;
  if(ele==="poison")return t.poisonRes;
  if(ele==="curse")return t.curseRes;
  return Math.min(75,(t.m.res||0));
}
function eleName(e){return{fire:"火焰",cold:"冰冷",light:"閃電",poison:"毒素",curse:"詛咒"}[e]||""}

/* 戰鬥：多怪 */
function fight(skillKey){
  if(!S)return;
  if(!pack.length||pack.every(function(e){return e.hp<=0}))pack=genPack();
  var t=tot();
  var sk=skillKey?getSkill(skillKey):null;
  if(sk&&!(S.skills[skillKey]>0))sk=null;
  if(sk&&sk.t==="passive"){log("被動已常駐","sys");return}
  var cost=0;
  if(sk){
    if(sk.t==="spell"||sk.t==="dot"||sk.t==="control")cost=Math.max(3,4+(S.skills[skillKey]||1)*2);
    else if(sk.t==="summon")cost=5+(S.skills[skillKey]||1);
    else cost=3;
  }
  if(cost>S.mp){log("魔力不足","warn");return}
  S.mp-=cost;

  var alive=pack.filter(function(e){return e.hp>0});
  if(!alive.length){pack=genPack();alive=pack}

  var target=alive[0];
  var dmg=0,mul=(sk&&sk.mul)?sk.mul:1,hits=(sk&&sk.hits)?sk.hits:1;var skLv=sk?(S.skills[skillKey]||1):1;if(sk&&sk.mul)mul=mul*(1+(skLv-1)*0.08);
  var baseAtk=(sk&&(sk.t==="spell"||sk.t==="dot"||sk.t==="control"))?t.sp:t.a;
  var eDef=target.def*(1-(target.defDown||0));
  dmg=Math.max(1,Math.floor(baseAtk*mul-eDef*0.4+rnd(0,3)));

  if(sk){
    if(sk.t==="summon"&&sk.min){addMinion(sk.min,S.skills[skillKey]||1);dmg=0}
    else if(sk.armyBurst){var total=0;S.minions.forEach(function(mn){var md=Math.floor(mn.atk*sk.armyBurst);total+=md;target.hp-=md});log("軍團爆發 "+total,"sum");dmg=0}
    else if(sk.t==="heal"){if(sk.healPct)S.hp=Math.min(t.hp,S.hp+Math.floor(t.hp*sk.healPct));if(sk.mpPct)S.mp=Math.min(t.mp,S.mp+Math.floor(t.mp*sk.mpPct));if(sk.shieldPct)S.shield=Math.floor(t.hp*sk.shieldPct);log("回復","heal");dmg=0}
    else if(sk.t==="shield"){S.shield=Math.floor(t.hp*(sk.shieldPct||0.2));log("護盾 "+S.shield,"sys");dmg=0}
    else if(sk.t==="buff"){if(!S.buffs)S.buffs={};if(sk.atkBuff){S.buffs.atk=sk.atkBuff;S.buffs.atk_dur=sk.dur||3}if(sk.defBuff){S.buffs.def=sk.defBuff;S.buffs.def_dur=sk.dur||3};log(sk.n+" 生效","sys");if(!sk.mul)dmg=0}
    else if(sk.t==="debuff"||sk.t==="control"){if(sk.defDown)target.defDown=Math.max(target.defDown||0,sk.defDown);if(sk.atkDown)target.atkDown=Math.max(target.atkDown||0,sk.atkDown);log(sk.n+" 施加","sys")}
    else if(sk.t==="dot"){if(sk.dot){target.dot=Math.max(target.dot||0,sk.dot);target.dotDur=Math.max(target.dotDur||0,sk.dotDur||3)}log(sk.n+" 附加","warn")}
    if(sk.vamp&&dmg>0){var heal=Math.floor(dmg*sk.vamp);S.hp=Math.min(t.hp,S.hp+heal);log("汲取 "+heal,"heal")}
    if(sk.dotBonus&&target.dot)dmg=Math.floor(dmg*(1+sk.dotBonus));
  }
  if(dmg>0){
    for(var h=0;h<hits;h++){var hd=h===0?dmg:Math.max(1,Math.floor(baseAtk*mul-eDef*0.4+rnd(0,2)));target.hp-=hd;log((sk?sk.n:"攻擊")+" → "+target.name+" "+hd,"dmg")}
    if(t.m.lifeSteal)S.hp=Math.min(t.hp,S.hp+Math.floor(dmg*t.m.lifeSteal/100));
  }
  S.minions.forEach(function(mn){
    if(target.hp<=0){alive=pack.filter(function(e){return e.hp>0});if(alive.length)target=alive[0];else return}
    var md=Math.max(1,Math.floor(mn.atk-target.def*0.2+rnd(0,2)));target.hp-=md;log(mn.name+" → "+target.name+" "+md,"sum");
  });
  pack.forEach(function(e){if(e.hp>0&&e.dot&&e.dotDur>0){var dd=Math.max(1,Math.floor(e.max*e.dot));e.hp-=dd;e.dotDur--;log(e.name+" 持續傷害 "+dd,"warn")}});

  var killed=pack.filter(function(e){return e.hp<=0&&!e._scored});
  killed.forEach(function(e){
    e._scored=true;S.kills++;if(e.rank==="boss"||e.rank==="unique")S.boss++;
    S.xp+=e.xp;S.gold+=e.gold;
    log("擊敗"+(e.rank==="unique"?"獨特":e.rank==="boss"?"首領":e.rank==="champ"?"精英":"")+e.name+" +"+e.xp+"經驗 +"+e.gold+"金","sys");
    var ch=e.rank==="unique"?0.7:e.rank==="boss"?0.5:e.rank==="champ"?0.28:0.1;
    if(Math.random()<Math.min(0.75,ch*(e.loot||1)))handleLoot(makeItem(e.rank==="unique"?5:e.rank==="boss"?4:e.rank==="champ"?2:0,e.rank==="unique"&&Math.random()<0.12));
    if((e.rank==="boss"||e.rank==="unique")&&Math.random()<0.07){
          var roll=Math.random(), pool;
          if(roll<0.62)pool=RUNES.filter(function(r){return r.num<=10});
          else if(roll<0.88)pool=RUNES.filter(function(r){return r.num>=11&&r.num<=20});
          else if(roll<0.97)pool=RUNES.filter(function(r){return r.num>=21&&r.num<=28});
          else if(roll<0.995)pool=RUNES.filter(function(r){return r.num>=29&&r.num<=31});
          else pool=RUNES.filter(function(r){return r.num>=32});
          if(pool.length){var rn=pick(pool);S.runes.push(rn.n);log("符文："+rn.n+" #"+rn.num,"drop")}
        }
    if((e.rank==="boss"||e.rank==="unique"||e.rank==="champ")&&Math.random()<0.12){var dp=pick(DROP_POT);S.pot[dp.id]=(S.pot[dp.id]||0)+1;log("掉落 "+dp.n,"drop")}
  });
  if(pack.every(function(e){return e.hp<=0})){
    S.hp=Math.min(tot().hp,S.hp+Math.floor(tot().hp*0.05));
    S.mp=Math.min(tot().mp,S.mp+Math.floor(tot().mp*0.03));
    if(t.m.lifeRegen)S.hp=Math.min(tot().hp,S.hp+t.m.lifeRegen);
    levelUp();pack=[];
  }else{
    /* 所有存活怪物攻擊玩家 */
    var attackers=pack.filter(function(e){return e.hp>0}).slice(0,8);
    attackers.forEach(function(en){
      var raw=Math.max(1,en.atk*(1-(en.atkDown||0))-t.d*0.5+rnd(0,3));
      var eleDmg=0,eleLabel="";
      if(en.ele&&en.elePct){
        eleDmg=Math.floor(raw*en.elePct);
        var r=playerRes(en.ele);
        eleDmg=Math.floor(eleDmg*(1-r/100));
        eleLabel=eleName(en.ele);
        raw=Math.floor(raw*(1-en.elePct));
      }
      var phys=Math.max(0,raw);
      var totalD=phys+eleDmg;
      var tanks=S.minions.filter(function(m){return m.tank&&m.hp>0});
      var allm=S.minions.filter(function(m){return m.hp>0});
      if(tanks.length||allm.length){
        var mn=pick(tanks.length?tanks:allm);
        var md=Math.max(1,Math.floor(totalD*(mn.tank?0.8:1)));
        mn.hp-=md;
        log(en.name+(eleLabel?"（"+eleLabel+"）":"")+" → "+mn.name+" "+md,"warn");
        if(mn.hp<=0){log(mn.name+" 陣亡","warn");S.minions=S.minions.filter(function(x){return x!==mn})}
      }else{
        if(S.shield>0){var ab=Math.min(S.shield,totalD);S.shield-=ab;totalD-=ab;if(S.shield<=0)log("護盾破碎","warn")}
        if(totalD>0){
          var tdr=tot().dr||0;if(tdr)totalD=Math.max(1,Math.floor(totalD*(1-tdr/100)));
          S.hp-=totalD;
          log(en.name+(eleLabel?"（"+eleLabel+"）":"")+" → 你 "+totalD+(eleLabel?" [抗性已計]":"")+(tdr?" [減傷"+tdr+"%]":""),"ele");
        }
      }
    });
    if(S.hp<=0){
      S.hp=Math.floor(tot().hp*0.35);S.mp=Math.floor(tot().mp*0.35);
      S.gold=Math.max(0,S.gold-Math.floor(S.gold*0.03));
      S.minions=[];S.shield=0;pack=[];
      log("被圍攻擊倒，撤回營地","warn");
    }
  }
  if(S.buffs){["atk","def"].forEach(function(k){if(S.buffs[k+"_dur"]){S.buffs[k+"_dur"]--;if(S.buffs[k+"_dur"]<=0){delete S.buffs[k];delete S.buffs[k+"_dur"]}}})}
  save();renderAll();
}

function maxMinions(){return(S.cid==="soul"?6:3)+(mods().summonCap||0)}
function addMinion(ex,lv){
  if(!ex||!ex.n)return;var c=ex.c||1;if(S.cid==="soul")c+=1;
  var t=tot(),m=mods();
  for(var i=0;i<c;i++){
    if(S.minions.length>=maxMinions()){var idx=S.minions.findIndex(function(x){return !x.tank});S.minions.splice(idx<0?0:idx,1)}
    var atk=Math.floor(t.a*(ex.am||0.5)*(1+(m.summonAtk||0)/100)*(1+lv*0.12));
    var hp=Math.floor(t.hp*(ex.hm||0.4)*(1+(m.summonHp||0)/100)*(1+lv*0.12));
    /* 技能等級顯著強化 */
    atk=Math.floor(atk*(1+(lv-1)*0.09)); hp=Math.floor(hp*(1+(lv-1)*0.09));
    if(S.cid==="soul"){atk=Math.floor(atk*1.12);hp=Math.floor(hp*1.12)}
    S.minions.push({name:ex.n,hp:hp,max:hp,atk:atk,tank:!!ex.tank});
  }
  log("召喚 "+c+" 隻"+ex.n+"（"+S.minions.length+"/"+maxMinions()+"）","sum");
}

function makeItem(bonus,forceU,opts){
  bonus=bonus||0; opts=opts||{};
  /* 獨特 */
  if(forceU||(bonus>=4&&Math.random()<0.035)||Math.random()<0.0015){
    var pool=UNIQUES.filter(function(u){return u.il<=S.lv+12});
    if(pool.length){
      var u=pick(pool);
      var um=Object.assign({},u.mods);
      /* 職業全技能類詞綴 */
      if(Math.random()<0.25)um.allSkills=(um.allSkills||0)+1;
      if(Math.random()<0.2)um.classSkills=(um.classSkills||0)+1;
      if(Math.random()<0.35)um.res=(um.res||0)+rnd(8,18);
      return{id:uid(),name:u.name,slot:u.slot,il:u.il,req:u.req,rar:"獨特",mods:um,bs:Object.assign({},u.bs),id_ed:Math.random()<0.1,sock:0,filled:[],unique:1,desc:u.desc};
    }
  }
  /* 套裝件：9件套，主手極稀有 */
  if(bonus>=2&&Math.random()<0.008){
    var sns=Object.keys(SETS_INFO),sn=pick(sns),info=SETS_INFO[sn];
    var pi=rnd(0,info.pieces.length-1);
    /* 主手索引2 極稀 */
    if(pi===2&&Math.random()>0.08)pi=pick([0,1,3,4,5,6,7,8]);
    var pn=info.pieces[pi],sl=info.slots[pi]||"身體";
    if(sl==="戒指")sl=Math.random()<0.5?"戒指":"戒指";
    var il=Math.min(S.lv+6,55);
    var sm={};
    if(Math.random()<0.15){ /* 有詞綴的套裝更稀 */
      sm.atkPct=rnd(4,12);sm.hp=rnd(8,20);if(Math.random()<0.3)sm.res=rnd(4,10);
    }
    return{id:uid(),name:pn,slot:sl==="戒指"?(Math.random()<0.5?"戒指":"戒指"):sl,il:il,req:Math.max(1,il-4),rar:"套裝",mods:sm,bs:{atk:rnd(3,12),def:rnd(4,16)},id_ed:false,set:sn,sock:0,filled:[]};
  }
  var elig=BASES.filter(function(b){return b[2]<=S.lv+S.zone*2+5});
  var b=pick(elig.length?elig:BASES);
  var il=Math.max(b[2],Math.min(S.lv+rnd(-2,4)+S.zone,b[2]+25));
  var req=Math.max(1,Math.min(il-rnd(1,4),S.lv+5));
  var tier=il>=22?3:il>=10?2:1;
  var r=Math.random(),rar;
  if(opts.forceRar)rar=opts.forceRar;
  else if(bonus>=3)rar=r<0.5?"稀有":r<0.85?"史詩":r<0.96?"傳奇":"獨特";
  else if(bonus>=1)rar=r<0.55?"魔法":r<0.88?"稀有":r<0.97?"史詩":"傳奇";
  else rar=r<0.52?"普通":r<0.86?"魔法":r<0.96?"稀有":r<0.994?"史詩":"傳奇";

  var cnt=rar==="普通"?0:rar==="魔法"?1:rar==="稀有"?rnd(1,2):rar==="史詩"?rnd(2,3):rnd(2,4);
  var modsObj={},affPre=[],affSuf=[];
  function addAff(arr,into){if(!arr.length)return;var a=pick(arr);into.push(a[0]);Object.keys(a[1]).forEach(function(k){var rg=a[1][k];modsObj[k]=(modsObj[k]||0)+rnd(rg[0],rg[1])})}
  var pp=PRE.filter(function(x){return x[2]<=tier}),ss=SUF.filter(function(x){return x[2]<=tier});
  for(var i=0;i<Math.ceil(cnt/2);i++)addAff(pp,affPre);
  for(var j=0;j<Math.floor(cnt/2);j++)addAff(ss,affSuf);
  /* 稀有以上有機會全抗、全技能 */
  if(rar==="史詩"||rar==="傳奇"){
    if(Math.random()<0.2)modsObj.res=(modsObj.res||0)+rnd(6,14);
    if(Math.random()<0.08)modsObj.allSkills=(modsObj.allSkills||0)+1;
    if(Math.random()<0.1)modsObj.classSkills=(modsObj.classSkills||0)+1;
  }
  var bs={atk:b[3][0]?rnd(b[3][0],b[3][1]):0,spell:0,def:b[4][0]?rnd(b[4][0],b[4][1]):0};
  if(b[1]==="項鍊"||b[1]==="戒指")bs.spell=b[3][0]?rnd(b[3][0],b[3][1]):0;
  var mul={"普通":1,"魔法":1.12,"稀有":1.28,"史詩":1.5,"傳奇":1.75}[rar]||1;
  Object.keys(bs).forEach(function(k){bs[k]=Math.floor(bs[k]*mul)});

  /* 洞：白裝可有詞綴也可有洞；6洞極稀 */
  var sock=0;
  if(b[5]>0){
    if(rar==="普通"){
      if(Math.random()<0.18)sock=rnd(1,Math.min(b[5],4));
      if(b[5]>=6&&Math.random()<0.012)sock=6; /* 令人髮指的6洞 */
      else if(b[5]>=5&&Math.random()<0.03)sock=5;
      else if(b[5]>=4&&Math.random()<0.06)sock=4;
    } else if(Math.random()<0.1){
      sock=rnd(1,Math.min(b[5],3));
    }
  }
  /* 白裝可帶少量詞綴（可符文） */
  if(rar==="普通"&&sock>0&&Math.random()<0.35){
    addAff(pp.filter(function(x){return x[2]<=2}),affPre);
  }
  var mid=pick(MID);
  var dispName=(affPre.length?affPre.join("")+" ":"")+(rar==="普通"?"":mid)+(affPre.length||rar!=="普通"?" ":"")+b[0]+(affSuf.length?" "+affSuf.join(""):"");
  if(rar==="普通"&&!affPre.length&&!affSuf.length)dispName=b[0];
  return{id:uid(),name:dispName,slot:b[1],il:il,req:req,rar:rar,mods:modsObj,bs:bs,id_ed:rar==="普通"||Math.random()<0.04,sock:sock,filled:[],locked:false};
}
function handleLoot(it){
  var cfg=(S.auto&&S.auto.loot)?S.auto.loot:defAuto().loot;
  var act=cfg[it.rar];
  if(it.sock>0&&cfg.sock===false)return;
  if(act===false&&!(it.sock>0&&cfg.sock===true))return;
  if(act==="sell"&&!(it.sock>0&&cfg.sock===true)){
    var mul={"普通":1,"魔法":2,"稀有":5,"史詩":12,"傳奇":22,"獨特":40}[it.rar]||1;

  var slot=it.slot;if(slot==="戒指")slot=!getEq("戒指1")?"戒指1":"戒指2";

}

function doSellOne(id){

  if(idx<0)return;for(var k in S.eq)if(S.eq[k]===id)delete S.eq[k];
  var mul={"普通":1,"魔法":2,"稀有":5,"史詩":12,"傳奇":22,"獨特":40,"套裝":16}[it.rar]||1;
  var v=Math.max(2,Math.floor((it.il+Object.keys(it.mods||{}).reduce(function(a,k){return a+Math.abs(it.mods[k])},0))*mul));
  if(!it.id_ed)v=Math.floor(v*0.35);S.gold+=v;S.items.splice(idx,1);log("出售 "+itemName(it)+" +"+v,"sys");save();renderAll();

function doSellByRarity(rar){

  if(!list.length){log("沒有可出售物品","sys");return}
  askYes(rar==="all"?"出售全部未裝備（"+list.length+"件）？":"出售全部未裝備「"+rar+"」（"+list.length+"件）？",function(){
    var gold=0;list.forEach(function(it){
      var mul={"普通":1,"魔法":2,"稀有":5,"史詩":12,"傳奇":22,"獨特":40,"套裝":16}[it.rar]||1;
      var v=Math.max(2,Math.floor((it.il+Object.keys(it.mods||{}).reduce(function(a,k){return a+Math.abs(it.mods[k])},0))*mul));
      if(!it.id_ed)v=Math.floor(v*0.35);gold+=v;

  }

function doIdentifyAll(){

  log("一鍵鑑定 "+n+" 件","sys");save();renderAll();

function trySocket(itemId,runeId){
  var it=null;for(var i=0;i<S.items.length;i++)if(S.items[i].id===itemId){it=S.items[i];break}
  if(!it||!it.id_ed)return;
  if(!it.sock||(it.filled||[]).length>=it.sock){log("無空凹槽","warn");return}
  if(it.rar!=="普通"&&!it.rw){log("符文之語只能鑲嵌在白色（普通）有孔裝備","warn");return}
  var rn=RUNE_BY_ID[runeId]||RUNE_BY_ID[RUNE_MIG[runeId]];
  var rname=rn?rn.n:runeId;
  var idx=S.runes.indexOf(runeId); if(idx<0)idx=S.runes.indexOf(rname);
  if(idx<0){log("無此符文","warn");return}
  S.runes.splice(idx,1); if(!it.filled)it.filled=[]; it.filled.push(rname);
  var key=it.filled.join("+");
  for(var r=0;r<RUNEWORDS.length;r++){
    var rw=RUNEWORDS[r];
    if(rw.r.join("+")===key){
      if(it.sock!==rw.s){log("洞數必須剛好為 "+rw.s+"（目前"+it.sock+"）才能完成「"+rw.name+"」","warn");save();renderAll();return}
      /* 全身只能一件相同符文之語 */
      var has=false;
      Object.keys(S.eq).forEach(function(slot){
        var id=S.eq[slot]; for(var j=0;j<S.items.length;j++)if(S.items[j].id===id&&S.items[j].rw===rw.name)has=true;
      });
      if(has){log("已裝備相同符文之語「"+rw.name+"」，無法再完成一件","warn");save();renderAll();return}
      it.rw=rw.name; it.rwMods=Object.assign({},rw.m);
      log("符文之語「"+it.rw+"」完成！","drop"); save(); renderAll(); return;
    }
  }
  log("鑲嵌 "+rname+(rn?" (#"+rn.num+")":""),"sys"); save(); renderAll();
}
function learnSkill(key){
  var sk=getSkill(key);if(!sk)return;var n=S.skills[key]||0;
  if(S.sp<1){log("技能點不足","warn");return}if(S.lv<sk.req){log("需等級 "+sk.req,"warn");return}if(n>=15){log("已滿級","warn");return}
  if(S.specTree&&S.specTree!==sk.tree){log("你已專精「"+S.specTree+"」，無法學習其他系技能","warn");return}
  if(!S.specTree)S.specTree=sk.tree;
  S.skills[key]=n+1;S.sp--;
  log((n?"強化":"學會")+" "+sk.n+" Lv."+(n+1)+(sk.t==="passive"?"（常駐）":"")+"　專精："+S.specTree,"sys");
  save();renderAll();
}

  S.ap-=pts;S[stat]+=pts;if(stat==="vit"){S.mhp+=pts*2;S.hp+=pts*2}if(stat==="ene"){S.mmp+=pts*2;S.mp+=pts*2}
  log({str:"力量",dex:"敏捷",vit:"體力",ene:"能量"}[stat]+" +"+pts,"sys");save();renderAll();
}
function buyPot(id){
  var p=null;for(var i=0;i<POTIONS.length;i++)if(POTIONS[i].id===id){p=POTIONS[i];break}if(!p)return;
  if(S.gold<p.p){log("金幣不足","warn");return}S.gold-=p.p;
  if(p.id==="town")S.pot.town++;else if(p.id==="idS")S.pot.idS=(S.pot.idS||0)+1;else S.pot[p.id]=(S.pot[p.id]||0)+1;

function usePot(id){
  if(id==="town"){if(!S.pot.town){log("沒有歸營卷軸","warn");return}S.pot.town--;pack=[];S.minions=[];S.shield=0;stopAuto();log("返回營地","sys");save();renderAll();return}
  if(id==="idS"){log("請在裝備頁鑑定","sys");return}
  var all=POTIONS.concat(DROP_POT),p=null;for(var i=0;i<all.length;i++)if(all[i].id===id){p=all[i];break}

  if(p.type==="hp")S.hp=Math.min(t.hp,S.hp+p.v);else S.mp=Math.min(t.mp,S.mp+p.v);
  log("使用 "+p.n,"heal");save();renderAll();

function autoTick(){
  if(!S||!autoOn)return;var t=tot(),cfg=S.auto||defAuto();
  if(S.hp<t.hp*cfg.hpTh){var hps=[cfg.hpPot,"hpX","hpL","hpM","hpS"];for(var i=0;i<hps.length;i++)if(S.pot[hps[i]]){usePot(hps[i]);return}}
  if(S.mp<t.mp*cfg.mpTh){var mps=[cfg.mpPot,"mpX","mpL","mpM","mpS"];for(var j=0;j<mps.length;j++)if(S.pot[mps[j]]){usePot(mps[j]);return}}
  if(cfg.reSummon){var ss=Object.keys(S.skills).filter(function(k){var sk=getSkill(k);return sk&&sk.t==="summon"&&S.skills[k]>0});if(!S.minions.length&&ss.length){fight((cfg.skills.filter(function(k){return ss.indexOf(k)>=0})[0])||ss[0]);return}}
  var act=(cfg.skills||[]).filter(function(k){var sk=getSkill(k);return sk&&sk.t!=="passive"&&S.skills[k]>0});
  if(cfg.preferSkill&&act.length){var can=act.filter(function(k){var sk=getSkill(k);var c=(sk.t==="spell"||sk.t==="dot")?Math.max(3,4+(S.skills[k]||1)*2):(sk.t==="summon"?5+(S.skills[k]||1):3);return S.mp>=c});if(can.length){fight(pick(can));return}}
  fight();
}

      return'<div class="item"><span class="'+it.rar+'" style="font-weight:600">'+esc(itemName(it))+'</span><span class="pill">'+it.rar+'</span>'+
        (it.req?'<span class="pill">需'+it.req+'</span>':'')+(!it.id_ed?'<span class="pill" style="color:var(--r)">未鑑定</span>':'')+
        (it.sock?'<span class="pill">洞'+(it.filled?it.filled.length:0)+'/'+it.sock+'</span>':'')+
        (it.set?'<span class="pill link btn-set" data-set="'+it.set+'">套裝</span>':'')+
        (it.rw?'<span class="pill link btn-rw" data-rw="'+it.rw+'">符文之語</span>':'')+
        '<div class="mu">'+it.slot+' · '+esc(itemDesc(it))+'</div>'+
        '<div class="row" style="margin-top:6px">'+(!it.id_ed?'<button class="sm primary btn-id" data-id="'+it.id+'">鑑定</button>':'<button class="sm btn-equip" data-id="'+it.id+'">裝備</button>')+
        '<button class="sm btn-sell-one" data-id="'+it.id+'">出售</button>'+
        (it.id_ed&&it.sock&&it.rar==="普通"&&(it.filled||[]).length<it.sock?'<button class="sm btn-sock" data-id="'+it.id+'">鑲嵌</button>':'')+
        '</div></div>';
    }).join(""):'<div class="mu">背包空</div>')+
    '<div class="notice">符文之語只能鑲嵌在白色（普通）有孔裝備。最多6孔。套裝／符文之語可點擊查看。</div>';
}
function renderRunes(){
  var cnt={};(S.runes||[]).forEach(function(r){cnt[r]=(cnt[r]||0)+1});
  var list=Object.keys(cnt).map(function(id){
    var rn=RUNE_BY_ID[id]||null;if(!rn){for(var i=0;i<RUNES.length;i++)if(RUNES[i].id===id||RUNES[i].n===id){rn=RUNES[i];break}}
    var mods=rn?Object.keys(rn.m).map(function(k){return fmtAffix(k,rn.m[k])}).join(" · "):"";
    return'<div class="item"><b>'+(rn?rn.n:id)+'</b>'+(rn?' <span class="pill">#'+rn.num+'</span>':'')+' ×'+cnt[id]+' <span class="mu">'+mods+'</span></div>';
  }).join("")||'<div class="mu">無符文</div>';
  $("v-runes").innerHTML=list+'<div style="margin-top:12px"><b>符文之語配方</b> <span class="mu">（僅白裝有孔）</span></div>'+
    RUNEWORDS.map(function(rw){
      return'<div class="item"><b class="link btn-rw" data-rw="'+rw.name+'" style="color:var(--g)">'+rw.name+'</b> <span class="pill">'+rw.s+'洞</span> <span class="mu">'+rw.d+'</span>'+
        '<div class="mu">'+rw.r.join(" + ")+'</div>'+
        '<div class="mu">'+Object.keys(rw.m).map(function(k){return fmtAffix(k,rw.m[k])}).join(" · ")+'</div></div>';
    }).join("");
}
function gamblePrice(kind){
  /* 低消 30 萬；以上隨荷包上浮 */
  var g=Math.max(0,S.gold||0);
  var floor=300000;
  if(g<=floor)return floor;
  var rate=kind==="rune"?0.10:kind==="weapon"?0.14:0.12;
  var base=Math.floor(g*rate);
  return Math.max(floor, Math.min(base, Math.floor(g*0.40)));
}
function doGamble(kind){
  var price=gamblePrice(kind);
  if(S.gold<price){log("金幣不足（需"+price+"）","warn");return}
  S.gold-=price;
  if(kind==="rune"){
    /* 高編號符文爆率令人髮指 */
    var roll=Math.random(), pickR;
    if(roll<0.70)pickR=pick(RUNES.filter(function(r){return r.num<=10}));
    else if(roll<0.90)pickR=pick(RUNES.filter(function(r){return r.num>=11&&r.num<=20}));
    else if(roll<0.97)pickR=pick(RUNES.filter(function(r){return r.num>=21&&r.num<=27}));
    else if(roll<0.994)pickR=pick(RUNES.filter(function(r){return r.num>=28&&r.num<=31}));
    else pickR=pick(RUNES.filter(function(r){return r.num>=32}));
    S.runes.push(pickR.n);
    log("賭符文：獲得「"+pickR.n+"」#"+pickR.num+"（-"+price+"金）","drop");
  } else {
    var bonus=0;
    var rr=Math.random();
    /* 比打怪更低的極品率 */
    if(rr<0.70)bonus=0;
    else if(rr<0.88)bonus=1;
    else if(rr<0.96)bonus=2;
    else if(rr<0.992)bonus=3;
    else bonus=4;
    var it=makeItem(bonus, rr>0.997);
    if(kind==="weapon"){
      /* 強制武器類 */
      var tries=0;
      while(it.slot!=="主手"&&it.slot!=="副手"&&tries++<8)it=makeItem(bonus,false);
      if(it.slot!=="主手"&&it.slot!=="副手"){it.slot="主手";it.name="賭坊兵刃"}
    }
    it.id_ed=false; /* 必未鑑定 */
    S.items.push(it);
    log("賭"+(kind==="weapon"?"武器":"裝備")+"：獲得未鑑定物品（-"+price+"金）","drop");
  }
  save();renderAll();
}
function renderShop(){
  var pg=gamblePrice("gear"), pw=gamblePrice("weapon"), pr=gamblePrice("rune");
  $("v-shop").innerHTML=
    '<div class="notice" style="margin-bottom:10px">「黑市賭坊」<br>不標價、不保證。未鑑定的裝備、武器與符文，全憑手氣。<br>每次至少 <b style="color:var(--g)">30 萬金</b>；荷包越鼓，價碼越高。<br>有人在這裡翻身——也有人在這裡把金幣花光。<br><span style="color:var(--mu)">貨物開箱前皆為未鑑定。買定離手。</span></div>'+
    '<div class="row" style="margin-bottom:10px">'+
      '<button class="primary" id="btnGambleGear" style="flex:1">賭裝備<br><span class="mu">'+pg+' 金</span></button>'+
      '<button class="primary" id="btnGambleWeapon" style="flex:1">賭武器<br><span class="mu">'+pw+' 金</span></button>'+
      '<button class="primary" id="btnGambleRune" style="flex:1">賭符文<br><span class="mu">'+pr+' 金</span></button>'+
    '</div>'+
    '<div class="mu" style="margin-bottom:8px">常規補給（不限量）</div>'+
    POTIONS.map(function(p){return'<div class="item"><b>'+p.n+'</b> <span class="mu">'+p.p+'金</span><button class="sm btn-buy" data-id="'+p.id+'" style="float:right">購買</button></div>'}).join("")+
    '<div class="notice">無鑑定卷軸時，鑑定會自動扣 28 金代購一卷（金幣足夠時）。</div>';
}
function renderAll(){if(!S)return;renderStatBar();renderHero();renderHunt();renderAuto();renderSkills();renderGear();renderRunes();renderShop();renderLog()}

function renderSelect(){
  $("charSelect").classList.remove("hidden");$("gameUI").classList.add("hidden");stopAuto();
  var html="";
  for(var i=0;i<2;i++){
    if(slots[i]){var ch=slots[i];html+='<div class="char-card"><b>'+esc(ch.name)+'</b><div class="mu">'+(CLASSES[ch.cid]?CLASSES[ch.cid].n:"?")+' · Lv.'+ch.lv+' · 擊殺 '+(ch.kills||0)+'</div><div class="btns"><button class="primary btn-enter" data-idx="'+i+'">進入</button><button class="danger btn-del" data-idx="'+i+'">刪除</button></div></div>'}
    else html+='<div class="char-card"><div class="mu">空欄位</div><div class="btns"><button class="primary btn-create" data-idx="'+i+'">建立新角色</button></div></div>';
  }
  $("slotList").innerHTML=html;$("createArea").classList.add("hidden");
}
function showCreate(idx){
  if(slots.filter(Boolean).length>=2){showDlg("提示","已滿2個角色");return}
  selClass="iron";window._cidx=idx;$("createArea").classList.remove("hidden");
  $("classGrid").innerHTML=Object.keys(CLASSES).map(function(k){var v=CLASSES[k];return'<div class="class-card'+(selClass===k?" on":"")+'" data-cls="'+k+'"><h4>'+v.n+'</h4><div class="mu">'+v.r+'</div></div>'}).join("");
}
function enterSlot(i){
  if(i<0||i>1||!slots[i])return;active=i;S=JSON.parse(JSON.stringify(slots[i]));
  S.minions=S.minions||[];S.runes=migrateRunes(S.runes||[]);S.auto=S.auto||defAuto();
  if(!S.auto.loot)S.auto.loot=defAuto().loot;S.buffs=S.buffs||{};S.shield=S.shield||0;
  S.str=S.str!=null?S.str:CLASSES[S.cid].a[0];S.dex=S.dex!=null?S.dex:CLASSES[S.cid].a[1];
  S.vit=S.vit!=null?S.vit:CLASSES[S.cid].a[2];S.ene=S.ene!=null?S.ene:CLASSES[S.cid].a[3];
  S.ap=S.ap!=null?S.ap:0;S.sp=S.sp!=null?S.sp:0;S.specTree=S.specTree||null;
  S.pot=Object.assign({hpS:3,mpS:3,town:1,idS:2},S.pot||{});
  S.items=(S.items||[]).map(function(it){return Object.assign({},it,{id_ed:it.id_ed!=null?it.id_ed:true,filled:migrateRunes(it.filled||[]),sock:it.sock||0,req:it.req!=null?it.req:Math.max(1,(it.il||1)-3)})});
  pack=[];
  if(S.lastSave){
    var min=Math.floor((Date.now()-S.lastSave)/60000);
    if(min>=5){
      min=Math.min(min,360);
      var settleId=String(S.lastSave)+"_"+min;
      if(S.lastSettlementId===settleId){/* 防重複 */}
      else{
        var fights=Math.floor(min*0.35*(1+S.diff*0.12));
        if(fights>=1){
          var xp=0,gold=0,drops=0;
          for(var f=0;f<fights;f++){
            xp+=Math.floor((8+S.lv*3)*DIFF[S.diff][2]*0.35);
            gold+=Math.floor((2+S.lv)*DIFF[S.diff][1]*0.35);
            if(Math.random()<0.08+S.diff*0.02){var it=makeItem(S.diff>=2?2:S.diff>=1?1:0,false);S.items.push(it);drops++;}
          }
          var maxDrop=Math.min(8,2+Math.floor(min/30));
          while(drops>maxDrop){S.items.pop();drops--}
          S.xp+=xp;S.gold+=gold;S.kills+=fights;S.lastSettlementId=settleId;levelUp();
          log("離線"+min+"分 +"+xp+"經驗 +"+gold+"金"+(drops?" +裝備"+drops+"件":""),"sys");
        }
      }
    }
  }
  $("charSelect").classList.add("hidden");$("gameUI").classList.remove("hidden");
  log("進入遠征","sys");renderAll();switchTab("hero");
}

document.addEventListener("click",function(ev){
  var t=ev.target;
  if(t.classList.contains("btn-enter")){enterSlot(+t.getAttribute("data-idx"));return}
  if(t.classList.contains("btn-del")){var di=+t.getAttribute("data-idx");if(!slots[di])return;askYes("確定刪除「"+slots[di].name+"」？",function(){slots[di]=null;slots=slots.filter(Boolean);while(slots.length<2)slots.push(null);saveAll();renderSelect()});return}
  if(t.classList.contains("btn-create")){showCreate(+t.getAttribute("data-idx"));return}
  if(t.classList.contains("class-card")||t.closest(".class-card")){var card=t.classList.contains("class-card")?t:t.closest(".class-card");selClass=card.getAttribute("data-cls");document.querySelectorAll(".class-card").forEach(function(c){c.classList.toggle("on",c.getAttribute("data-cls")===selClass)});return}
  if(!S)return;
  if(t.classList.contains("btn-attr")){addAttr(t.getAttribute("data-stat"),+t.getAttribute("data-pts"));return}
  if(t.classList.contains("btn-pot")){usePot(t.getAttribute("data-pot"));return}
  if(t.id==="btnFight"){fight();return}
  if(t.id==="btnToggleAuto"||t.id==="btnToggleAuto2"){toggleAuto();return}
  if(t.classList.contains("btn-zone")){var z=+t.getAttribute("data-zone");var zz=ZONES[z];if(S.lv<zz.min){log("需等級 "+zz.min,"warn");return}if(zz.unique&&S.diff<2){log("諸王陵寢僅煉獄可進","warn");return}S.zone=z;pack=[];log("前往 "+zz.name,"sys");save();renderAll();return}
  if(t.classList.contains("btn-diff")){S.diff=+t.getAttribute("data-diff");pack=[];log("難度："+DIFF[S.diff][0],"sys");save();renderAll();return}
  if(t.classList.contains("btn-learn")){learnSkill(t.getAttribute("data-key"));return}
  if(t.classList.contains("btn-equip")){doEquip(t.getAttribute("data-id"));return}
  if(t.classList.contains("btn-unequip")){doUnequip(t.getAttribute("data-slot"));return}
  if(t.classList.contains("btn-sell-one")){doSellOne(t.getAttribute("data-id"));return}
  if(t.classList.contains("btn-sell-rar")){doSellByRarity(t.getAttribute("data-rar"));return}
  if(t.classList.contains("btn-id")){doIdentify(t.getAttribute("data-id"));return}
  if(t.id==="btnIdAll"){doIdentifyAll();return}
  if(t.id==="btnGambleGear"){doGamble("gear");return}
  if(t.id==="btnGambleWeapon"){doGamble("weapon");return}
  if(t.id==="btnGambleRune"){doGamble("rune");return}
  if(t.classList.contains("btn-buy")){buyPot(t.getAttribute("data-id"));return}
  if(t.classList.contains("btn-set")){var sn=t.getAttribute("data-set"),info=SETS_INFO[sn];if(info){var b='';if(info.bonus3)b+='<b>3件：</b>'+info.bonus3.join('、')+'<br>';if(info.bonus6)b+='<b>6件：</b>'+info.bonus6.join('、')+'<br>';if(info.bonus9)b+='<b>9件：</b>'+info.bonus9.join('、')+'（含全抗+50）<br>';if(info.bonus)b+=info.bonus.join('<br>');showDlg('套裝：'+sn,'<b>組成（9件）：</b>'+info.pieces.join('、')+'<br><br>'+b);return}}
  if(t.classList.contains("btn-rw")){var rn=t.getAttribute("data-rw");var rw=null;for(var i=0;i<RUNEWORDS.length;i++)if(RUNEWORDS[i].name===rn){rw=RUNEWORDS[i];break}if(rw)showDlg("符文之語："+rw.name,"<b>需要：</b>"+rw.r.join(" + ")+"<br><b>凹槽：</b>"+rw.s+"<br><b>類型：</b>"+rw.d+"<br><br><b>屬性：</b><br>"+Object.keys(rw.m).map(function(k){return fmtAffix(k,rw.m[k])}).join("<br>")+"<br><br><span class='mu'>僅可鑲嵌於白色（普通）有孔裝備</span>");return}
  if(t.classList.contains("btn-sock")){
    var iid=t.getAttribute("data-id");
    if(!S.runes.length){log("沒有符文","warn");return}
    var names=[];var seen={};S.runes.forEach(function(r){if(!seen[r]){seen[r]=1;names.push(r)}});
    showDlg("選擇符文鑲嵌",names.map(function(r){return'<button class="sm btn-pick-rune" data-item="'+iid+'" data-rune="'+r+'" style="margin:4px">'+r+'</button>'}).join(" "));
    return;
  }
  if(t.classList.contains("btn-pick-rune")){trySocket(t.getAttribute("data-item"),t.getAttribute("data-rune"));$("overlay").classList.add("hidden");return}
});
document.addEventListener("change",function(ev){
  if(!S)return;var t=ev.target;
  if(t.classList.contains("auto-sk")){if(!S.auto)S.auto=defAuto();var k=t.getAttribute("data-sk");if(t.checked){if(S.auto.skills.indexOf(k)<0)S.auto.skills.push(k)}else S.auto.skills=S.auto.skills.filter(function(x){return x!==k});save()}
  if(t.id==="chkReSum"){S.auto.reSummon=t.checked;save()}if(t.id==="chkPref"){S.auto.preferSkill=t.checked;save()}
  if(t.id==="inpHpTh"){S.auto.hpTh=Math.min(90,Math.max(5,+t.value))/100;save()}if(t.id==="inpMpTh"){S.auto.mpTh=Math.min(90,Math.max(5,+t.value))/100;save()}
  if(t.classList.contains("loot-sel")){var v=t.value;S.auto.loot[t.getAttribute("data-rar")]=v==="true"?true:v==="false"?false:"sell";save()}
});
$("btnCreate").onclick=function(){var name=($("newName").value||"遠征者").trim().slice(0,16);var idx=typeof window._cidx==="number"?window._cidx:slots.findIndex(function(x){return !x});if(idx<0||slots[idx])idx=slots.findIndex(function(x){return !x});if(idx<0){showDlg("提示","欄位已滿");return}slots[idx]=fresh(selClass,name);saveAll();enterSlot(idx)};
$("btnCancelCreate").onclick=function(){$("createArea").classList.add("hidden")};
$("btnBack").onclick=function(){askYes("返回角色選擇？",function(){save();active=-1;S=null;pack=[];stopAuto();renderSelect()})};
$("btnSave").onclick=function(){save();showDlg("提示","已儲存")};
$("btnExport").onclick=function(){save();var pkg=buildExportPackage();var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(pkg,null,2)],{type:"application/json"}));a.download="深淵遠征-存檔.json";a.click();showDlg("提示","已匯出簽章存檔（schema v"+SCHEMA_VERSION+"）")};
$("btnImport").onclick=function(){$("fileIn").click()};
$("fileIn").onchange=function(e){
  var f=e.target.files[0];if(!f)return;
  if(f.size>2*1024*1024){showDlg("錯誤","檔案過大");e.target.value="";return}
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var x=JSON.parse(reader.result);
      var result=tryImportPackage(x);
      if(!result.ok){
        showDlg("匯入拒絕","存檔驗證失敗，<b>原存檔未改動</b>。<br><br>"+result.errors.map(function(er){return "• "+er}).join("<br>"));
        e.target.value="";return;
      }
      pushBackup({slots:slots,active:active,schemaVersion:SCHEMA_VERSION});
      slots=result.data.slots;while(slots.length<2)slots.push(null);
      active=result.data.active!=null?result.data.active:-1;
      saveAll();
      if(active>=0&&slots[active])enterSlot(active);else renderSelect();
      showDlg("提示",result.legacy?"舊格式已匯入（無簽章，已做規則檢查）":"簽章存檔匯入成功");
    }catch(err){showDlg("錯誤","格式錯誤："+(err.message||err))}
    e.target.value="";
  };
  reader.readAsText(f);
};
$("btnClearLog").onclick=function(){if(S){S.logs=[];renderLog()}};
document.querySelectorAll("#tabs button").forEach(function(b){b.onclick=function(){switchTab(b.getAttribute("data-tab"))}});
$("overlay").addEventListener("click",function(e){if(e.target===$("overlay"))$("overlay").classList.add("hidden")});

load();renderSelect();
window.addEventListener("pagehide",function(){if(S)save()});
})();
